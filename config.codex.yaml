# Simulation configuration using Codex CLI via scripts/run_codex_prompt.sh

simulation:
  duration: 100
  half_space_size: 25
  half_place_size: 5

agents:
  num_agents: 20
  communication_radius: 5
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3

places:
  - name: "left_bar"
    type: "bar"
    center_x: -15
    center_y: 0
    half_size: 5
    capacity: 12
  - name: "right_bar"
    type: "bar"
    center_x: 15
    center_y: 0
    half_size: 5
    capacity: 10

llm:
  provider: "command"
  model: "codex-cli"
  command:
    - "./scripts/run_codex_prompt.sh"
  prompt_mode: "stdin"
  response_format: "text"
  timeout_seconds: 300

fires:
  - name: "fire_1"
    start_step: 35
    intensity: 0.8
    radius: 15
    center_x: 15
    center_y: 10
  - name: "fire_2"
    start_step: 70
    intensity: 0.5
    radius: 8
    center_x: -10
    center_y: -10

economy:
  enabled: true
  base_wage: 2.5
  living_cost: 1.5
  initial_cash_balance: 6.0
  initial_structure_credits: 0.0
  structure_credit_name: "structure credits"
  message_reward: 0.25
  fire_coordination_reward: 1.00
  decongestion_reward: 0.75
  fire_escape_reward: 1.25
  crowding_threshold: 0.85
  llm_automation:
    enabled: true
    start_step: 20
    interval: 15
    job_losses_per_wave: 2
  job_types:
    - name: "routine_clerk"
      automation_risk: 0.95
    - name: "customer_support"
      automation_risk: 0.85
    - name: "content_writer"
      automation_risk: 0.80
    - name: "accounting_assistant"
      automation_risk: 0.75
    - name: "teacher"
      automation_risk: 0.40
    - name: "care_worker"
      automation_risk: 0.20

visualization:
  save_frames: true
  frame_interval: 1
  output_dir: "output_codex"

logging:
  level: "INFO"
  log_file: "simulation_codex.log"
