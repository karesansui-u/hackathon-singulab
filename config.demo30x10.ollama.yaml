# 30-turn / 10-agent demo tuned for local Ollama execution

simulation:
  duration: 30
  half_space_size: 20
  half_place_size: 4

agents:
  num_agents: 10
  communication_radius: 5
  memory_limit: 8
  memory_size: 2
  message_history_limit: 4
  message_context_size: 1

places:
  - name: "left_bar"
    type: "bar"
    center_x: -10
    center_y: 0
    half_size: 4
    capacity: 6
  - name: "right_bar"
    type: "bar"
    center_x: 10
    center_y: 0
    half_size: 4
    capacity: 6

llm:
  provider: "ollama"
  model: "qwen3.5:9b"
  base_url: "http://localhost:11434"
  temperature: 0.2
  max_tokens: 128
  repeat_penalty: 1.1
  repeat_last_n: 128
  min_p: 0.05

fires:
  - name: "center_fire"
    start_step: 8
    intensity: 0.65
    radius: 9
    center_x: 0
    center_y: 0
  - name: "south_fire"
    start_step: 20
    intensity: 0.45
    radius: 7
    center_x: 0
    center_y: -10

economy:
  enabled: false

visualization:
  save_frames: true
  frame_interval: 1
  output_dir: "output/demo30x10_ollama"

logging:
  level: "INFO"
  log_file: "simulation_demo30x10_ollama.log"
