schema_version: 1.0.0
snapshot_date: 2026-04-16

selection_method:
  agents:
    - geopolitics_security
    - resources_supply_chain
    - regulation_finance_mediation
  tier_rules:
    T1:
      consensus_required: 3
      target_count: 30
    T2:
      consensus_required: 2
      target_count: 20
    T3:
      consensus_required: 1
      target_count: 10

presets:
  core_30:
    tiers: [T1]
    max_countries: 30
    description: Tier 1 core countries only.
  current_realism_32:
    tiers: [T1]
    include_codes: [UKR, ITA]
    max_countries: 32
    description: Core 30 plus Ukraine and Italy for a 2026 realism-oriented baseline.
  europe_frontline_30:
    tiers: [T1]
    include_codes: [UKR, ITA]
    exclude_codes: [OMN, MAR]
    max_countries: 30
    description: 30-country alternative that swaps in Ukraine and Italy for Oman and Morocco.
  extended_50:
    tiers: [T1, T2]
    max_countries: 50
    description: Tier 1 plus Tier 2 expansion.
  full_60:
    tiers: [T1, T2, T3]
    max_countries: 60
    description: Tier 1 through Tier 3.

