<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>制度設計シミュレーション — Hackathon Presentation</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			-webkit-print-color-adjust: exact;
			print-color-adjust: exact;
		}

		:root {
			--navy: #0a2540;
			--text: #425466;
			--text-light: #68778d;
			--purple: #635bff;
			--purple-light: #7a73ff;
			--purple-bg: #f0eeff;
			--cyan: #00d4aa;
			--cyan-dark: #00a884;
			--cyan-bg: #e6faf5;
			--bg: #ffffff;
			--bg-alt: #f6f9fc;
			--border: #e3e8ee;
			--red: #ff5b6a;
			--red-bg: #fff0f2;
			--amber: #f5a524;
			--amber-bg: #fff6e6;
		}

		html,
		body {
			overflow: hidden;
			height: 100%;
		}

		body {
			font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
			background: #0a0a0a;
			color: var(--text);
			line-height: 1.6;
		}

		.deck {
			position: relative;
			width: 100vw;
			height: 100vh;
		}

		.slide {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.45s ease;
		}

		.slide.active {
			opacity: 1;
			pointer-events: auto;
		}

		.slide-inner {
			width: 1280px;
			height: 720px;
			background: var(--bg);
			border-radius: 8px;
			overflow: hidden;
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: flex-start;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
		}

		.slide-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 16px 40px;
			border-bottom: 0;
			background:
				repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.052) 0 1px, transparent 1px 13px),
				linear-gradient(90deg, #102033 0%, #17395a 58%, #0f766e 100%);
			box-shadow: inset 0 -3px 0 #b7791f;
			flex-shrink: 0;
			position: relative;
			z-index: 5;
		}

		.slide-header-logo {
			display: flex;
			align-items: baseline;
			gap: 8px;
		}

		.slide-header-logo .name {
			font-size: 14px;
			font-weight: 700;
			color: #ffffff;
		}

		.slide-header-badge {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 12px;
			font-weight: 600;
			color: rgba(255, 255, 255, 0.78);
		}

		.slide-header-badge .badge-label {
			color: #102033;
			font-weight: 700;
			text-transform: uppercase;
			background: rgba(255, 255, 255, 0.94);
			border-radius: 999px;
			padding: 3px 10px;
			box-shadow: inset 0 -3px 0 #b7791f;
		}

		.slide-header-badge .badge-pct {
			background: rgba(255, 255, 255, 0.94);
			color: #102033;
			font-size: 11px;
			font-weight: 700;
			padding: 2px 8px;
			border-radius: 12px;
			box-shadow: inset 0 -3px 0 #b7791f;
		}

		.slide-body {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: flex-start;
			padding: 48px 72px;
			overflow: hidden;
		}

		.page-num {
			position: absolute;
			bottom: 20px;
			right: 36px;
			font-size: 12px;
			color: var(--text-light);
			font-weight: 500;
			font-variant-numeric: tabular-nums;
			z-index: 5;
		}

		#progress {
			position: fixed;
			bottom: 0;
			left: 0;
			height: 3px;
			background: var(--purple);
			transition: width 0.4s ease;
			z-index: 100;
		}

		h1 {
			font-size: 58px;
			font-weight: 800;
			color: var(--navy);
			line-height: 1.2;
			margin-bottom: 24px;
		}

		h2 {
			font-size: 38px;
			font-weight: 700;
			color: var(--navy);
			line-height: 1.3;
			margin-bottom: 20px;
		}

		h3 {
			font-size: 20px;
			font-weight: 600;
			color: var(--text);
			margin-bottom: 12px;
		}

		p {
			font-size: 20px;
			color: var(--text);
			line-height: 1.7;
			margin-bottom: 12px;
		}

		.lead {
			font-size: 24px;
			color: var(--text-light);
			font-weight: 400;
		}

		.question-slide-body {
			padding: 28px 46px 32px;
		}

		.question-title {
			font-size: 30px;
			line-height: 1.23;
			margin-bottom: 14px;
		}

		.question-risk-image {
			display: block;
			width: 100%;
			height: 458px;
			object-fit: contain;
			object-position: center center;
			border: 1px solid var(--border);
			border-radius: 14px;
			background: #fff;
			box-shadow: 0 14px 30px rgba(10, 37, 64, 0.10);
		}

		.slide-title .slide-inner {
			background:
				repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.052) 0 1px, transparent 1px 13px),
				radial-gradient(circle at 86% 22%, rgba(15, 118, 110, 0.34), transparent 34%),
				radial-gradient(circle at 20% 86%, rgba(183, 121, 31, 0.20), transparent 28%),
				linear-gradient(90deg, #102033 0%, #17395a 58%, #0f766e 100%);
			text-align: left;
			align-items: flex-start;
			justify-content: flex-start;
			padding: 54px 68px;
		}

		.slide-closing .slide-inner {
			background:
				repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.052) 0 1px, transparent 1px 13px),
				radial-gradient(circle at 84% 22%, rgba(15, 118, 110, 0.34), transparent 34%),
				radial-gradient(circle at 16% 78%, rgba(183, 121, 31, 0.22), transparent 30%),
				linear-gradient(90deg, #102033 0%, #17395a 58%, #0f766e 100%);
			text-align: center;
			align-items: center;
			justify-content: center;
			padding: 0;
		}

		.slide-closing .slide-inner::before {
			content: "";
			position: absolute;
			top: 44px;
			left: 48px;
			right: 48px;
			height: 1px;
			background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(183, 121, 31, 0.92) 34%, rgba(255, 255, 255, 0.52) 68%, rgba(15, 118, 110, 0));
		}

		.slide-closing .slide-inner::after {
			content: "";
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			background:
				radial-gradient(ellipse at 18% 92%, rgba(183, 121, 31, 0.22), transparent 34%),
				radial-gradient(ellipse at 82% 86%, rgba(15, 118, 110, 0.24), transparent 38%),
				linear-gradient(180deg, rgba(16, 32, 51, 0) 0%, rgba(16, 32, 51, 0) 58%, rgba(16, 32, 51, 0.58) 100%);
			opacity: 0.78;
		}

		.slide-title .slide-inner::before {
			content: "";
			position: absolute;
			top: 44px;
			left: 48px;
			right: 48px;
			height: 1px;
			background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(183, 121, 31, 0.92) 34%, rgba(255, 255, 255, 0.52) 68%, rgba(15, 118, 110, 0));
		}

		.slide-title .slide-inner::after {
			content: "";
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			background:
				radial-gradient(ellipse at 18% 92%, rgba(183, 121, 31, 0.20), transparent 34%),
				radial-gradient(ellipse at 82% 86%, rgba(15, 118, 110, 0.22), transparent 38%),
				linear-gradient(180deg, rgba(16, 32, 51, 0) 0%, rgba(16, 32, 51, 0) 58%, rgba(16, 32, 51, 0.54) 100%);
			opacity: 0.78;
		}

		.slide-title .slide-header,
		.slide-closing .slide-header {
			display: none;
		}

		.slide-title h1 {
			color: #fff;
			font-size: 66px;
			margin-bottom: 18px;
			position: relative;
			z-index: 2;
			letter-spacing: 0;
			max-width: none;
			white-space: nowrap;
		}

		.slide-title .subtitle {
			color: rgba(235, 246, 255, 0.84);
			font-size: 22px;
			font-weight: 400;
			line-height: 1.75;
			position: relative;
			z-index: 2;
			max-width: 780px;
		}

		.slide-title .tagline {
			display: inline-flex;
			align-items: center;
			width: fit-content;
			color: #102033;
			font-size: 13px;
			font-weight: 800;
			letter-spacing: 0;
			position: relative;
			z-index: 2;
			margin-bottom: 18px;
			padding: 7px 12px;
			border: 1px solid rgba(255, 255, 255, 0.24);
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.92);
			box-shadow: inset 0 -3px 0 #b7791f, 0 10px 24px rgba(16, 32, 51, 0.16);
		}

		.title-icon-field {
			position: absolute;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			z-index: 1;
		}

		.cover-icon {
			position: absolute;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 88px;
			height: 88px;
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 22px;
			background:
				linear-gradient(135deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.025)),
				rgba(10, 37, 64, 0.16);
			box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
			color: rgba(235, 246, 255, 0.60);
			font-size: 15px;
			font-weight: 800;
			letter-spacing: 0;
		}

		.cover-icon::before {
			content: "";
			position: absolute;
			inset: 20px;
			border: 2px solid currentColor;
			border-radius: 50%;
			opacity: 0.72;
		}

		.cover-icon::after {
			content: "";
			position: absolute;
			width: 28px;
			height: 3px;
			border-radius: 99px;
			background: currentColor;
			opacity: 0.62;
			transform: translateY(18px);
		}

		.cover-icon span {
			position: relative;
			z-index: 1;
		}

		.icon-ai {
			right: 92px;
			top: 86px;
			color: rgba(15, 118, 110, 0.74);
			transform: rotate(8deg);
		}

		.icon-policy {
			right: 252px;
			top: 130px;
			color: rgba(183, 121, 31, 0.72);
			transform: rotate(-7deg);
		}

		.icon-family {
			right: 132px;
			top: 238px;
			color: rgba(255, 255, 255, 0.56);
			transform: rotate(5deg);
		}

		.icon-care {
			left: 72px;
			bottom: 88px;
			color: rgba(15, 118, 110, 0.56);
			transform: rotate(-9deg);
		}

		.icon-signal {
			left: 318px;
			bottom: 122px;
			color: rgba(29, 79, 122, 0.62);
			transform: rotate(6deg);
		}

		.icon-index {
			right: 584px;
			bottom: 72px;
			color: rgba(183, 121, 31, 0.56);
			transform: rotate(-4deg);
		}

		.icon-map {
			right: 438px;
			top: 72px;
			color: rgba(255, 255, 255, 0.34);
			transform: rotate(10deg);
		}

		.icon-voice {
			left: 438px;
			top: 318px;
			color: rgba(15, 118, 110, 0.44);
			transform: rotate(-5deg);
		}

		.icon-loop {
			right: 38px;
			bottom: 78px;
			color: rgba(255, 255, 255, 0.42);
			transform: rotate(8deg);
		}

		.title-screenshot {
			position: absolute;
			right: 60px;
			bottom: 58px;
			width: 486px;
			height: 412px;
			object-fit: cover;
			object-position: center center;
			border: 1px solid rgba(183, 121, 31, 0.58);
			border-radius: 14px;
			box-shadow: 0 26px 58px rgba(0, 0, 0, 0.34), 0 0 0 1px rgba(255, 255, 255, 0.14);
			opacity: 0.96;
			z-index: 2;
		}

		.slide-title .page-num,
		.slide-closing .page-num {
			color: rgba(255, 255, 255, 0.3);
		}

		.section-badge {
			display: inline-flex;
			align-items: center;
			align-self: flex-start;
			gap: 8px;
			font-size: 12px;
			font-weight: 700;
			color: var(--purple);
			text-transform: uppercase;
			margin-bottom: 16px;
		}

		.section-badge::before {
			content: '';
			width: 24px;
			height: 3px;
			border-radius: 4px;
			background: var(--purple);
		}

		.callout {
			background: var(--bg-alt);
			border-left: 4px solid var(--purple);
			border-radius: 0 12px 12px 0;
			padding: 24px 32px;
			margin: 20px 0;
			font-size: 22px;
			color: var(--navy);
			font-weight: 500;
		}

		.callout-cyan {
			border-left-color: var(--cyan);
			background: var(--cyan-bg);
		}

		.callout-red {
			border-left-color: var(--red);
			background: var(--red-bg);
		}

		.code-block {
			background: var(--navy);
			color: #e0e7ee;
			font-family: 'JetBrains Mono', monospace;
			font-size: 18px;
			padding: 20px 28px;
			border-radius: 12px;
			margin: 16px 0;
			line-height: 1.7;
		}

		.code-block .prompt {
			color: var(--cyan);
		}

		.code-block .cmd {
			color: #fff;
			font-weight: 500;
		}

		.code-block .flag {
			color: var(--purple-light);
		}

		.features {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
			margin-top: 16px;
		}

		.features-3 {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 18px;
			margin-top: 18px;
		}

		.feature {
			background: var(--bg-alt);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 24px 28px;
		}

		.feature-icon {
			width: 36px;
			height: 36px;
			border-radius: 8px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 16px;
			margin-bottom: 12px;
			font-weight: 700;
		}

		.feature-icon.purple {
			background: var(--purple-bg);
			color: var(--purple);
		}

		.feature-icon.cyan {
			background: var(--cyan-bg);
			color: var(--cyan-dark);
		}

		.feature-icon.amber {
			background: var(--amber-bg);
			color: var(--amber);
		}

		.feature-icon.red {
			background: var(--red-bg);
			color: var(--red);
		}

		.feature h3 {
			font-size: 16px;
			font-weight: 700;
			color: var(--navy);
			margin-bottom: 6px;
		}

		.feature p {
			font-size: 15px;
			color: var(--text-light);
			margin: 0;
			line-height: 1.5;
		}

		.bullet-list {
			list-style: none;
			padding: 0;
		}

		.bullet-list li {
			font-size: 20px;
			padding: 10px 0 10px 28px;
			position: relative;
			color: var(--text);
			border-bottom: 1px solid var(--border);
		}

		.bullet-list li:last-child {
			border-bottom: none;
		}

		.bullet-list li::before {
			content: '';
			position: absolute;
			left: 0;
			top: 22px;
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: var(--purple);
		}

		.bullet-list li strong {
			color: var(--navy);
			font-weight: 700;
		}

		.data-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 16px;
			margin-top: 12px;
		}

		.data-table th {
			text-align: left;
			padding: 12px 16px;
			font-weight: 600;
			color: var(--text-light);
			font-size: 13px;
			text-transform: uppercase;
			border-bottom: 2px solid var(--border);
		}

		.data-table td {
			padding: 11px 16px;
			border-bottom: 1px solid var(--border);
			color: var(--text);
		}

		.data-table td:first-child {
			font-weight: 600;
			color: var(--navy);
		}

		.data-table .badge {
			display: inline-block;
			background: var(--cyan-bg);
			color: var(--cyan-dark);
			font-size: 13px;
			font-weight: 600;
			padding: 2px 10px;
			border-radius: 20px;
		}

		.stats {
			display: flex;
			gap: 24px;
			margin: 24px 0;
		}

		.stat {
			flex: 1;
			text-align: center;
			padding: 24px 16px;
			background: var(--bg-alt);
			border-radius: 12px;
			border: 1px solid var(--border);
		}

		.stat-number {
			font-size: 40px;
			font-weight: 800;
			color: var(--navy);
			line-height: 1;
			margin-bottom: 6px;
			font-variant-numeric: tabular-nums;
		}

		.stat-number .unit {
			font-size: 20px;
			color: var(--text-light);
			font-weight: 500;
		}

		.stat-label {
			font-size: 14px;
			color: var(--text-light);
			font-weight: 500;
		}

		.hl {
			color: var(--purple);
			font-weight: 600;
		}

		.hl-navy {
			color: var(--navy);
			font-weight: 700;
		}

		.hl-red {
			color: var(--red);
			font-weight: 600;
		}

		.cols {
			display: flex;
			gap: 48px;
			align-items: flex-start;
		}

		.col {
			flex: 1;
		}

		.tag {
			display: inline-block;
			font-size: 13px;
			font-weight: 600;
			padding: 4px 12px;
			border-radius: 20px;
			margin-right: 6px;
		}

		.tag-purple {
			background: var(--purple-bg);
			color: var(--purple);
		}

		.tag-cyan {
			background: var(--cyan-bg);
			color: var(--cyan-dark);
		}

		.tag-amber {
			background: var(--amber-bg);
			color: var(--amber);
		}

		.flow {
			display: flex;
			align-items: center;
			gap: 8px;
			margin: 20px 0;
			flex-wrap: wrap;
		}

		.flow-step {
			background: var(--bg-alt);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 12px 18px;
			font-size: 15px;
			font-weight: 600;
			color: var(--navy);
			white-space: nowrap;
		}

		.flow-step.active {
			background: var(--purple);
			border-color: var(--purple);
			color: #fff;
		}

		.flow-arrow {
			color: var(--border);
			font-size: 20px;
		}

		.mini-map {
			height: 322px;
			background: linear-gradient(135deg, #f6f9fc 0%, #eef5fb 100%);
			border: 1px solid var(--border);
			border-radius: 12px;
			position: relative;
			overflow: hidden;
		}

		.room {
			position: absolute;
			width: 188px;
			height: 124px;
			background: rgba(255, 255, 255, 0.72);
			border: 1px solid var(--border);
			border-radius: 10px;
		}

		.room span {
			position: absolute;
			left: 12px;
			top: 10px;
			font-size: 12px;
			font-weight: 700;
			color: var(--text-light);
		}

		.agent-dot {
			position: absolute;
			width: 28px;
			height: 28px;
			border-radius: 50%;
			background: #fff;
			border: 2px solid var(--purple);
			box-shadow: 0 4px 14px rgba(10, 37, 64, 0.15);
		}

		.agent-dot::before {
			content: '';
			position: absolute;
			left: 8px;
			top: 5px;
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: currentColor;
		}

		.agent-dot::after {
			content: '';
			position: absolute;
			left: 6px;
			bottom: 5px;
			width: 12px;
			height: 8px;
			border-radius: 8px 8px 4px 4px;
			background: currentColor;
			opacity: 0.22;
		}

		.demo-capture {
			display: block;
