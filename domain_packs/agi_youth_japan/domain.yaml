schema_version: "domain_pack_v0.1"
pack_id: "agi_youth_japan"
display_name: "AGI時代の日本の若者・現役世代"
inherits: "default_v1"
language: "ja"

time:
  start_step: 1
  step_unit: "month"
  steps: 24

data:
  agents:
    - "${pack}/data/youth_agents.tsv"
    - "${pack}/data/working_agents.tsv"
  agent_segments: "${pack}/data/agent_segments.tsv"
  events: "${pack}/data/events.tsv"
  update_coefficients: "${pack}/data/update_coefficients.tsv"
  evidence_map: "${pack}/data/evidence_map.tsv"
  cognition_layers: "${pack}/data/cognition_layers.tsv"
  ripple_channel_dictionary: "${pack}/data/ripple_channel_dictionary.tsv"
  world_events: "${pack}/data/world_events.tsv"

prompts:
  system_context: "${pack}/prompts/system_context.md"
  agent_observation: "${pack}/prompts/agent_observation.md"

viewer:
  viewer_id: "future_emotion_map"
  config: "${pack}/viewer/viewer_config.yaml"

hooks:
  export_viewer:
    - id: "future_emotion_map_export"
      enabled: false
      module: "visualization.future_emotion_map"
      function: "export_viewer"
      config:
        viewer_id: "future_emotion_map"

scenarios:
  baseline: "${pack}/scenarios/baseline.yaml"
  stress: "${pack}/scenarios/stress.yaml"

column_aliases:
  agent_id: ["エージェントID"]
  population_weight: ["人口重み_パーセント"]
  event_id: ["イベントID"]
  start_step: ["開始ステップ"]

output:
  row_schema: "agent_turn_v1"
  run_root: "outputs/runs"
