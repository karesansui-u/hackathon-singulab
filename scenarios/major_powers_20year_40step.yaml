    domestic_trigger_bonus: 0.05
    country_effects:
      USA:
        cash_stability: -0.03
        inequality_pressure: 0.03
      EU:
        cash_stability: -0.02
        inequality_pressure: 0.02
      IND:
        cash_stability: -0.03
        inequality_pressure: 0.03
      BRA:
        cash_stability: -0.03
        inequality_pressure: 0.03

  - turn: 22
    name: Climate adaptation gap widens
    description: Heat, water, and crop volatility accumulate unevenly across the system.
    domestic_trigger_bonus: 0.04
    country_effects:
      IND:
        climate_stress: 0.06
        food_security: -0.04
      BRA:
        climate_stress: 0.07
        food_security: -0.04
      SAU:
        climate_stress: 0.05
      EU:
        climate_stress: 0.03
      CHN:
        climate_stress: 0.03

  - turn: 26
