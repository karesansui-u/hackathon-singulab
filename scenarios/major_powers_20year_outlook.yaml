extends: major_powers_world_demo.yaml

meta:
  name: Major Powers 20-Year Outlook
  turns: 20
  output_dir: output/world_demo/major_powers_20year_outlook
  seed: 20260420
  turn_duration_months: 12
  default_scenario: managed_transition

events:
  - turn: 2
    name: Frontier AI diffuses into white-collar workflows
    description: General reasoning systems become standard in finance, law, media, and software operations.
    domestic_trigger_bonus: 0.03
    modifiers:
      labor_displacement_bonus: 0.012

  - turn: 4
    name: Compute and grid bottlenecks
    description: Data center buildout and power constraints sharpen competition over compute and energy.
    domestic_trigger_bonus: 0.02
    country_effects:
      CHN:
        compute_access: -0.04
        sanction_exposure: 0.03
      EU:
        energy_security: -0.03
      JPN:
        energy_security: -0.04
      IND:
        energy_security: -0.02

  - turn: 5
    name: Social buffering pilots expand
    description: Some blocs begin structure-credit rails, wage buffering, and public adaptation infrastructure.
    modifiers:
      structure_credit_bonus: 0.015
      cooperation_bonus: 0.01

  - turn: 7
    name: Physical AI enters logistics and warehousing
    description: Robotics adoption reaches ports, warehouses, delivery, and routine manufacturing.
    domestic_trigger_bonus: 0.035
    modifiers:
      labor_displacement_bonus: 0.014
    country_effects:
      USA:
        supply_chain_resilience: 0.02
      CHN:
        supply_chain_resilience: 0.02
      JPN:
        supply_chain_resilience: 0.02

  - turn: 9
    name: Housing and debt squeeze
    description: Cost-of-living stress and debt servicing intensify political anger in several regions.
    domestic_trigger_bonus: 0.05
    country_effects:
      USA:
        cash_stability: -0.03
        inequality_pressure: 0.03
      EU:
        cash_stability: -0.02
        inequality_pressure: 0.02
      IND:
        cash_stability: -0.03
        inequality_pressure: 0.03
      BRA:
        cash_stability: -0.03
        inequality_pressure: 0.03

  - turn: 11
    name: Climate adaptation gap widens
    description: Heat, water, and crop volatility accumulate unevenly across the system.
    domestic_trigger_bonus: 0.04
    country_effects:
      IND:
        climate_stress: 0.06
        food_security: -0.04
      BRA:
        climate_stress: 0.07
        food_security: -0.04
      SAU:
        climate_stress: 0.05
      EU:
        climate_stress: 0.03
      CHN:
        climate_stress: 0.03

  - turn: 13
    name: Strategic blocs harden
    description: Semiconductor, robotics, and industrial policy blocs deepen sanctions and trade friction.
    domestic_trigger_bonus: 0.03
    country_effects:
      CHN:
        sanction_exposure: 0.05
        conflict_risk: 0.03
      RUS:
        sanction_exposure: 0.06
        conflict_risk: 0.04
      EU:
        energy_security: -0.03
      JPN:
        supply_chain_resilience: -0.03

  - turn: 15
    name: Resilience capital rotation
    description: Capital winners can increasingly rotate profits into redundancy, care, and distribution systems.
    modifiers:
      winner_reinvestment_bonus: 0.025
      structure_credit_bonus: 0.01

  - turn: 17
    name: Food-water shocks and migration pressure
    description: Repeated regional disruptions produce migration, welfare strain, and internal political backlash.
    domestic_trigger_bonus: 0.055
    country_effects:
      IND:
        food_security: -0.05
        conflict_risk: 0.04
      BRA:
        food_security: -0.04
        conflict_risk: 0.03
      EU:
        social_cohesion: -0.03
      USA:
        social_cohesion: -0.03

  - turn: 19
    name: Institutional settlement attempt
    description: Late-stage settlements try to stabilize distribution, public legitimacy, and cross-border resilience.
    modifiers:
      cooperation_bonus: 0.03
      structure_credit_bonus: 0.02
      winner_reinvestment_bonus: 0.015

