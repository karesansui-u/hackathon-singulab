events:
  - turn: 2
    name: Frontier model diffusion wave
    description: High-capability frontier models spread into white-collar workflows.
    modifiers:
      labor_displacement_bonus: 0.025

  - turn: 3
    name: Advanced semiconductor controls tighten
    description: Export controls narrow advanced compute access for some blocs.
    country_effects:
      CHN:
        compute_access: -0.08
        sanction_exposure: 0.06
      USA:
        supply_chain_resilience: -0.02
      EU:
        supply_chain_resilience: -0.02
      JPN:
        supply_chain_resilience: -0.03

  - turn: 4
    name: Maritime chokepoint disruption
    description: Shipping risk raises energy and trade friction for import-heavy economies.
    country_effects:
      EU:
        energy_security: -0.08
        supply_chain_resilience: -0.05
      JPN:
        energy_security: -0.10
        supply_chain_resilience: -0.06
      IND:
        energy_security: -0.07
        supply_chain_resilience: -0.05
      SAU:
        conflict_risk: 0.05

  - turn: 5
    name: Public adaptation fork
    description: Countries decide whether to build distribution and structure-credit rails quickly.
    modifiers:
      structure_credit_bonus: 0.025

  - turn: 6
    name: Heat and crop volatility
    description: Climate shocks hit tropical and subtropical production belts.
    country_effects:
      IND:
        climate_stress: 0.08
        food_security: -0.04
      BRA:
        climate_stress: 0.09
        food_security: -0.05
      EU:
        climate_stress: 0.03

  - turn: 7
    name: Resilience funds open
    description: Capital winners can rotate profits into resilience and redundancy investments.
    modifiers:
      winner_reinvestment_bonus: 0.05

  - turn: 8
    name: Sanctions and bloc pressure escalate
    description: Conflict blocs face another round of restrictions and trade friction.
    country_effects:
      RUS:
        sanction_exposure: 0.08
        conflict_risk: 0.04
      CHN:
        sanction_exposure: 0.04
      EU:
        energy_security: -0.03
      IND:
        supply_chain_resilience: -0.03

  - turn: 9
    name: Multilateral resilience compact
    description: Some blocs coordinate support for food, energy and social stability.
    modifiers:
      cooperation_bonus: 0.08
      structure_credit_bonus: 0.02

scenarios:
