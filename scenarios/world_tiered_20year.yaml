meta:
  name: Tiered World Simulation
  turns: 20
  output_dir: output/world_demo/world_tiered_20year
  seed: 20260416
  turn_duration_months: 12
  default_scenario: managed_transition

country_selection:
  library: ../data/world_country_sets.yaml
  preset: current_realism_32

war_model:
  max_conflicts_per_turn: 4
  gray_zone_threshold: 0.30
  proxy_threshold: 0.37
  limited_war_threshold: 0.54
  nuclear_direct_war_cap: 0.42
  event_intensity_scale: 1.0

events:
  - turn: 2
    name: Frontier AI diffuses into white-collar workflows
    description: General reasoning systems become standard in finance, law, media, and software operations.
    modifiers:
      labor_displacement_bonus: 0.010
    tag_effects:
      ai_frontier:
        labor_displacement: 0.015
        compute_access: 0.010
      advanced_industrial:
        labor_displacement: 0.010
        inequality_pressure: 0.010
      population_giant:
        inequality_pressure: 0.010

  - turn: 4
    name: Physical AI enters logistics and warehousing
    description: Robotics adoption reaches ports, warehouses, delivery, and routine manufacturing.
    domestic_trigger_bonus: 0.020
    modifiers:
      labor_displacement_bonus: 0.006
    tag_effects:
      manufacturing_hub:
        labor_displacement: 0.014
        cash_stability: -0.010
      chokepoint:
        supply_chain_resilience: -0.020
      population_giant:
        youth_unemployment: 0.020

  - turn: 6
    name: Compute and grid bottlenecks
    description: Data center buildout and power constraints sharpen competition over compute and energy.
    domestic_trigger_bonus: 0.010
    tag_effects:
      ai_frontier:
        compute_access: -0.050
        energy_security: -0.030
      energy_importer:
        energy_security: -0.050
        cash_stability: -0.020
      energy_exporter:
        capital_surplus: 0.030

  - turn: 8
    name: Housing and debt squeeze
    description: Cost-of-living stress and debt servicing intensify political anger in several regions.
    domestic_trigger_bonus: 0.040
    tag_effects:
      finance_hub:
        housing_pressure: 0.040
        cash_stability: -0.010
      debt_sensitive:
        housing_pressure: 0.050
        cash_stability: -0.030
        inequality_pressure: 0.020
      fragile_state:
        cash_stability: -0.020
        domestic_burden: 0.030

  - turn: 10
    name: Climate adaptation gap widens
    description: Heat, water, and crop volatility accumulate unevenly across the system.
    domestic_trigger_bonus: 0.040
    tag_effects:
      climate_frontline:
        climate_stress: 0.080
        food_security: -0.040
        domestic_burden: 0.030
      global_south:
        distribution_capacity: -0.010

  - turn: 12
    name: Strategic blocs harden
    description: Semiconductor, robotics, and industrial policy blocs deepen sanctions and trade friction.
    domestic_trigger_bonus: 0.030
    tag_effects:
      sanction_target:
        sanction_exposure: 0.060
        conflict_risk: 0.030
      semiconductor_core:
        supply_chain_resilience: -0.040
      revisionist:
        military_posture: 0.040
        conflict_risk: 0.020

  - turn: 14
    name: Food-water shocks and migration pressure
    description: Repeated regional disruptions produce migration, welfare strain, and internal political backlash.
    domestic_trigger_bonus: 0.050
    tag_effects:
      food_exporter:
        food_security: -0.030
      climate_frontline:
        food_security: -0.040
        domestic_burden: 0.040
        conflict_risk: 0.020

  - turn: 16
    name: Social buffering pilots expand
    description: Some blocs begin structure-credit rails, wage buffering, and public adaptation infrastructure.
    modifiers:
      structure_credit_bonus: 0.030
      cooperation_bonus: 0.050
    tag_effects:
      mediator:
        distribution_capacity: 0.030
        alliance_support: 0.030
      advanced_industrial:
        distribution_capacity: 0.020
      finance_hub:
        capital_surplus: 0.020

  - turn: 18
    name: Resilience capital rotation
    description: Capital winners can increasingly rotate profits into redundancy, care, and distribution systems.
    modifiers:
      winner_reinvestment_bonus: 0.050
      structure_credit_bonus: 0.020
    tag_effects:
      finance_hub:
        capital_surplus: 0.040
      energy_exporter:
        capital_surplus: 0.020
      fragile_state:
        alliance_support: 0.020

scenarios:
  - key: fracture
    name: 20-year fracture path
    automation_velocity: 0.100
    physical_automation_velocity: 0.055
    adaptation_velocity: 0.030
    structure_credit_intensity: 0.020
    cooperation_bias: 0.030
    winner_reinvestment: 0.020
    war_risk_bias: 0.100
    deescalation_capacity: 0.020

  - key: managed_transition
    name: 20-year managed transition
    automation_velocity: 0.100
    physical_automation_velocity: 0.055
    adaptation_velocity: 0.075
    structure_credit_intensity: 0.070
    cooperation_bias: 0.070
    winner_reinvestment: 0.060
    war_risk_bias: 0.015
    deescalation_capacity: 0.050

  - key: complement
    name: 20-year complement path
    automation_velocity: 0.100
    physical_automation_velocity: 0.055
    adaptation_velocity: 0.110
    structure_credit_intensity: 0.110
    cooperation_bias: 0.100
    winner_reinvestment: 0.090
    war_risk_bias: -0.035
    deescalation_capacity: 0.100
